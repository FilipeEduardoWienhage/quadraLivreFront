name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# um push novo cancela a execução anterior do mesmo ramo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # mesmo fuso do uso real (e dos testes locais)
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (inclui checagem de tipos)
        run: npm run build

      - name: Testes unitários
        run: npm test

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run test:e2e
        env:
          # no CI não há Chrome instalado: usa o Chromium baixado acima
          PW_CHANNEL: chromium

      - name: Relatório do Playwright (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report
            test-results
          retention-days: 7
